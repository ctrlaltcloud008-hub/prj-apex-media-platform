name: Service Validate

on:
  workflow_call:
    inputs:
      service:
        required: true
        type: string
      dockerfile:
        required: true
        type: string
      context:
        required: true
        type: string
      go_version:
        required: true
        type: string

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ inputs.go_version }}
          cache: true

      - name: Download modules
        run: go mod download

      - name: Build service
        shell: bash
        run: go build ./services/${{ inputs.service }}/cmd

      - name: Run service tests
        shell: bash
        run: go test ./services/${{ inputs.service }}/...

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: false
